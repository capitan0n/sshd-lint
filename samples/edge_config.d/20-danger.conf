# 20-danger.conf — an unclosed Match block at the end of a drop-in.
#
# This snippet opens a Match block and never closes it (no 'Match All' reset).
# sshd saves the Match state before an Include and restores it afterwards
# ("Don't let included files clobber the containing file's Match state",
# servconf.c), so the block ends with this file. The X11Forwarding and
# AllowTcpForwarding lines at the bottom of edge.conf stay GLOBAL, and
# sshd_lint must report them as global findings, not scoped to this Address.

Match Address 10.0.0.0/8
    PermitRootLogin yes
