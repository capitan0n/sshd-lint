# 20-danger.conf — the footgun this whole sample exists to demonstrate.
#
# This snippet opens a Match block and never closes it (no 'Match All' reset).
# Because sshd shares Match state across Include boundaries, the block stays
# open when control returns to edge.conf — so the X11Forwarding and
# AllowTcpForwarding lines at the bottom of edge.conf are silently scoped to
# "Address 10.0.0.0/8" instead of being global.
#
# The fix in the real world is to put the Include at the very top of the main
# config, before any Match can be active. sshd_lint should reveal the leak by
# scoping those trailing edge.conf findings to this Address condition.

Match Address 10.0.0.0/8
    PermitRootLogin yes
