# 10-cloudinit.conf — a drop-in that re-enables password auth for one user.
#
# This is the classic cloud-image pattern: the base config disables password
# auth globally, then an automation account gets it back inside a Match block.
# The finding must be SCOPED to the Match condition, not reported as a global
# regression — and it must name THIS file, not the top-level sshd_config.

Match User ansible
    PasswordAuthentication yes
    PubkeyAuthentication yes
