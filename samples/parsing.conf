# parsing.conf — regression cases for config-syntax corners (1.5.1 fixes).
#
# Each case below used to be silently misread. Run with:
#   sshd-lint samples/parsing.conf --base-dir samples --compact

# --- Trailing comment ------------------------------------------------------
# Since OpenSSH 8.7, a '#' that starts a word ends the line, so the value
# here is 'yes'. Must flag CRITICAL (it used to be read as "yes # TODO").
PermitRootLogin yes   # TODO: lock down after migration

# A '#' inside a word is NOT a comment -- the banner path stays intact.
Banner /etc/issue#net

# --- Include separated by a TAB --------------------------------------------
# Must be expanded. X11Forwarding yes from 10-real.conf must be reported.
# The dotfile .10-real.conf.bak next to it must NOT be read (sshd skips it).
Include	parsing_config.d/*.conf parsing_config.d/sub/*.conf

# --- Renamed directive: first spelling wins --------------------------------
# Both names set the same option; sshd uses the FIRST one. Must flag
# KbdInteractiveAuthentication yes, and report the second line as shadowed.
KbdInteractiveAuthentication yes
ChallengeResponseAuthentication no

PasswordAuthentication no
