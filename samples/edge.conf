# edge.conf — exercises Include expansion and Match-scope threading.
#
# This is the half that a single-file linter cannot model correctly. The real
# risk lives in the drop-in files under edge_config.d/, and in where a Match
# block opened in one file ends. Audit with:
#
#     sshd-lint samples/edge.conf --base-dir samples
#
# The --base-dir is needed because the Include path below is relative to this
# samples/ directory, not to sshd's hardcoded /etc/ssh.

# A globally sane baseline...
PermitRootLogin no
PasswordAuthentication no

# ...then pull in drop-in config. It sits in the middle here so that lines
# follow it in this file (see 20-danger.conf).
Include edge_config.d/*.conf

# These two lines are AFTER the Include. 20-danger.conf leaves a Match block
# open, but sshd restores this file's Match state when the Include returns
# (servconf.c), so both lines are GLOBAL -- verify with 'sshd -T'. A parser
# that let the Match leak would wrongly scope them to that Address range.
X11Forwarding yes
AllowTcpForwarding yes
