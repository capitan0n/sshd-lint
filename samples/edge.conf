# edge.conf — exercises Include expansion and Match-scope threading.
#
# This is the half that a single-file linter cannot model correctly. The real
# risk lives in the drop-in files under edge_config.d/, and in how a Match
# block opened in one file bleeds into another. Audit with:
#
#     sshd-lint samples/edge.conf --base-dir samples
#
# The --base-dir is needed because the Include path below is relative to this
# samples/ directory, not to sshd's hardcoded /etc/ssh.

# A globally sane baseline...
PermitRootLogin no
PasswordAuthentication no

# ...then pull in drop-in config. Distributions put this line at the TOP for a
# reason (see 20-danger.conf); here it sits in the middle to demonstrate what
# goes wrong when it doesn't.
Include edge_config.d/*.conf

# These two lines are AFTER the Include. If a Match block inside an included
# file was left open, real sshd applies it to everything that follows here —
# including these. A per-file parser would wrongly treat them as global.
X11Forwarding yes
AllowTcpForwarding yes
