# NOTE: intentionally NOT valid for `sshd -t` (see MaxAuthTries below) —
# sshd_lint audits configs offline, including ones sshd would reject.
# tricky.conf — a config that LOOKS hardened but hides several subtle traps.
#
# Every setting here is either valid sshd syntax that a naive linter skips, or
# a value whose danger is non-obvious. Nothing here is blatantly wrong the way
# chaos.conf is; the point is to catch the mistakes a careful admin actually
# makes. Confirm the file itself is syntactically accepted with `sshd -t`.

# --- Time values written the way sshd actually allows -----------------------
# A bare int() parser skips both of these and reports the file clean.
LoginGraceTime 5m
# 5 minutes = 300s, well over the recommended 60s ceiling -> should flag.

ClientAliveInterval 15m
# 15 minutes in suffix form. On its own this is fine...
ClientAliveCountMax 0
# ...but a zero count-max disables session termination entirely. The pair
# looks like a configured idle timeout and is in fact no timeout at all.

# --- LoginGraceTime's other face --------------------------------------------
# (Only one LoginGraceTime can win; this duplicate is here on purpose to show
#  first-wins shadowing catches it even for a directive with a time value.)
LoginGraceTime 0
# 0 = unlimited. Shadowed by the 5m above, so this should surface as a
# DUPLICATE finding rather than an "unlimited grace" finding.

# --- Cumulative directive: every Port line is live --------------------------
Port 22
Port 8022
# Port is cumulative — sshd listens on BOTH. A first-wins-only rule would flag
# 22 and ignore 8022. Port 22 -> INFO (default), 8022 is fine.

# --- Directive renamed across OpenSSH releases ------------------------------
KbdInteractiveAuthentication yes
# The modern spelling of ChallengeResponseAuthentication (8.7+). A rule that
# only knows the old name misses this entirely -> should flag MEDIUM.

PubkeyAcceptedKeyTypes ssh-rsa,ssh-ed25519
# The pre-8.5 spelling of PubkeyAcceptedAlgorithms. ssh-rsa (SHA-1) is
# deprecated -> should flag under the aliased rule.

# --- Cumulative directive that must NOT be flagged as duplicate -------------
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
HostCertificate /etc/ssh/ssh_host_rsa_key-cert.pub
# Two certs, one per host key. Legitimate. A rule that treats every repeat as
# shadowing produces a false positive here — it must stay silent.

# --- Algorithm default-set syntax: append still counts ----------------------
Ciphers +aes128-cbc
# The '+' appends to the compiled-in default rather than replacing it, so the
# weak CBC cipher is now negotiable even though the line looks additive and
# harmless -> should flag.

# --- A genuinely malformed value --------------------------------------------
MaxAuthTries four
# Not an integer. sshd would reject this at startup. The linter must report it
# as uninterpretable (LOW) rather than silently skipping the MaxAuthTries rule
# and leaving the impression it was checked.

# --- Quoted value -----------------------------------------------------------
Banner "/etc/ssh/banner.txt"
# Fully-quoted path. Should be unwrapped and treated as a configured banner
# (i.e. NOT flagged as "no banner").
