[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sshd-lint"
dynamic = ["version"]
description = "Zero-dependency static analyzer for OpenSSH sshd_config files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "capitan0n" }]
keywords = ["ssh", "sshd", "security", "hardening", "linter", "static-analysis", "cis", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/capitan0n/sshd-lint"
Repository = "https://github.com/capitan0n/sshd-lint"
Issues = "https://github.com/capitan0n/sshd-lint/issues"

[project.scripts]
sshd-lint = "sshd_lint:main"

[tool.hatch.version]
path = "src/sshd_lint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sshd_lint"]
