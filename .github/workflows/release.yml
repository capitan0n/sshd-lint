name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - name: Tag must match __version__
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/sshd_lint-${version}-py3-none-any.whl" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ in src/sshd_lint/__init__.py"
            ls dist
            exit 1
          fi
      - run: twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sshd-lint
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
